<header class="topbar">

    <h1>{% block page_title %}Dashboard{% endblock %}</h1>

    <div class="topbar-actions">
        <!-- Notificaciones Dropdown -->
        <div style="position: relative; cursor: pointer;" id="notif-container">
            <span id="notif-bell" style="font-size: 20px;">🔔</span>
            <span id="notif-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; font-size: 10px; padding: 2px 5px; font-weight: bold;">0</span>
            
            <div id="notif-dropdown" style="display: none; position: absolute; right: 0; top: 30px; width: 300px; background: white; border: 1px solid #e1e7f0; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; max-height: 400px; overflow-y: auto;">
                <div style="padding: 10px 15px; border-bottom: 1px solid #eee; font-weight: bold; color: #333;">Notificaciones</div>
                <div id="notif-list">
                    <!-- JS fills this -->
                    <div style="padding: 15px; text-align: center; color: #666; font-size: 13px;">Sin notificaciones nuevas.</div>
                </div>
            </div>
        </div>
        
        <div class="profile" style="display: flex; align-items: center; gap: 10px;">
            {% if empresa_actual %}
            <span style="font-weight: bold; color: #1abc9c;">🏢 {{ empresa_actual.nombre }}</span>
            <span style="color: #ccc;">|</span>
            {% endif %}
            <span>👤 {{ current_user.usuario }}</span>
        </div>
    </div>

</header>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const bell = document.getElementById('notif-bell');
    const drop = document.getElementById('notif-dropdown');
    
    bell.addEventListener('click', () => {
        drop.style.display = drop.style.display === 'none' ? 'block' : 'none';
    });
    
    document.addEventListener('click', (e) => {
        if (!document.getElementById('notif-container').contains(e.target)) {
            drop.style.display = 'none';
        }
    });

    try {
        const res = await fetch('/inventario/api/notificaciones');
        const notifs = await res.json();
        
        if (notifs.length > 0) {
            document.getElementById('notif-badge').style.display = 'block';
            document.getElementById('notif-badge').textContent = notifs.length;
            
            const list = document.getElementById('notif-list');
            list.innerHTML = '';
            
            notifs.forEach(n => {
                const item = document.createElement('div');
                item.style.cssText = "padding: 12px 15px; border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #333;";
                item.innerHTML = `
                    <div style="color: #e63946; font-weight: bold; margin-bottom: 4px;">⚠️ Stock Bajo</div>
                    <div>${n.mensaje}</div>
                    <div style="font-size: 11px; color: #999; margin-top: 4px;">${n.fecha}</div>
                `;
                list.appendChild(item);
            });
        }
    } catch(e) { console.error(e); }
});
</script>
