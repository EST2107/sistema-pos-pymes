<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Inventario</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
</head>
<body class="">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>

<div class="app-layout">
    
    <!-- Overlay for mobile sidebar -->
    <div id="mobileOverlay" class="mobile-overlay"></div>

    {% include 'layouts/sidebar.html' %}

    <main class="main-content">

        <header class="topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="mobileMenuBtn" class="mobile-menu-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
            </div>
            <div class="topbar-actions">
                <!-- Notificaciones Dropdown -->
                <div style="position: relative; cursor: pointer;" id="notif-container">
                    <span id="notif-bell" style="font-size: 20px;">🔔</span>
                    <span id="notif-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; font-size: 10px; padding: 2px 5px; font-weight: bold;">0</span>
                    <div id="notif-dropdown" style="display: none; position: absolute; right: 0; top: 30px; width: 300px; background: white; border: 1px solid #e1e7f0; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; max-height: 400px; overflow-y: auto;">
                        <div style="padding: 10px 15px; border-bottom: 1px solid #eee; font-weight: bold; color: #333;">Notificaciones</div>
                        <div id="notif-list">
                            <div style="padding: 15px; text-align: center; color: #666; font-size: 13px;">Sin notificaciones nuevas.</div>
                        </div>
                    </div>
                </div>
                <div class="profile" style="display: flex; align-items: center; gap: 10px;">
                    {% if empresa_actual %}
                    <span style="font-weight: bold; color: #1abc9c;">🏢 {{ empresa_actual.nombre }}</span>
                    <span style="color: #ccc;">|</span>
                    {% endif %}
                    <span>👤 {{ current_user.usuario }}</span>
                </div>
            </div>
        </header>

        <section class="page-content">
            {% block content %}{% endblock %}
        </section>

    </main>

</div>

{% block scripts %}{% endblock %}


<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Mobile Sidebar Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('mobileOverlay');

    function toggleSidebar() {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    }

    if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleSidebar);
    if(overlay) overlay.addEventListener('click', toggleSidebar);

    // Notifications logic
    const bell = document.getElementById('notif-bell');
    const drop = document.getElementById('notif-dropdown');

    bell.addEventListener('click', () => {
        drop.style.display = drop.style.display === 'none' ? 'block' : 'none';
    });

    document.addEventListener('click', (e) => {
        if (!document.getElementById('notif-container').contains(e.target)) {
            drop.style.display = 'none';
        }
    });

    try {
        const res = await fetch('/inventario/api/notificaciones');
        const notifs = await res.json();
        if (notifs.length > 0) {
            document.getElementById('notif-badge').style.display = 'block';
            document.getElementById('notif-badge').textContent = notifs.length;
            const list = document.getElementById('notif-list');
            list.innerHTML = '';
            notifs.forEach(n => {
                const item = document.createElement('div');
                item.style.cssText = "padding: 12px 15px; border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #333;";
                item.innerHTML = `
                    <div style="color: #e63946; font-weight: bold; margin-bottom: 4px;">⚠️ Stock Bajo</div>
                    <div>${n.mensaje}</div>
                    <div style="font-size: 11px; color: #999; margin-top: 4px;">${n.fecha}</div>
                `;
                list.appendChild(item);
            });
        }
    } catch(e) { console.error(e); }
});
</script>
</body>
</html>
